name: Build Crystal Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Poprawiona konfiguracja vcpkg ze stałym identyfikatorem SHA1
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '260d7cb0efb22a00940656f7ef5ebba2306bfda7'

    # Wymuszenie instalacji bibliotek w trybie nieinteraktywnym
    - name: Pre-install vcpkg dependencies
      run: |
        vcpkg install boost-system boost-asio boost-filesystem luajit openssl gmp mpfr libmariadb pthreads --triplet x64-windows
      shell: powershell

    - name: Run Crystal Installer Script (Automated)
      run: |
        $env:NONINTERACTIVE="true"
        .\crystal_windows_installer.ps1
      shell: powershell

    - name: Upload Compiled Server
      uses: actions/upload-artifact@v4
      with:
        name: crystal-server-windows
        path: |
          **/*.exe
          **/*.dll
