name: Build Crystal Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Automatyczna instalacja i konfiguracja vcpkg z pamięcią podręczną (Cache)
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'latest'

    # Wymuszenie instalacji bibliotek w trybie nieinteraktywnym przed uruchomieniem reszty skryptu
    - name: Pre-install vcpkg dependencies
      run: |
        vcpkg install boost-system boost-asio boost-filesystem luajit openssl gmp mpfr libmariadb pthreads --triplet x64-windows
      shell: powershell

    - name: Run Crystal Installer Script (Automated)
      run: |
        # Wymuszamy, aby skrypt nie pytał o potwierdzenia (Bypass/Automate)
        $env:NONINTERACTIVE="true"
        .\crystal_windows_installer.ps1
      shell: powershell

    - name: Upload Compiled Server
      uses: actions/upload-artifact@v4
      with:
        name: crystal-server-windows
        path: |
          **/*.exe
          **/*.dll
