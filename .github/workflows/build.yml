name: Build Crystal Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # Pobranie kodu repozytorium (używamy najnowszej wersji v4)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Konfiguracja MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Instalacja bibliotek bezpośrednio przez wbudowane w system vcpkg
    - name: Pre-install vcpkg dependencies
      run: |
        # Używamy wbudowanego w system vcpkg i wskazujemy mu domyślną ścieżkę instalacji
        vcpkg install boost-system boost-asio boost-filesystem luajit openssl gmp mpfr libmariadb pthreads --triplet x64-windows
      shell: powershell

    # Uruchomienie skryptu instalacyjnego serwera Crystal
    - name: Run Crystal Installer Script (Automated)
      run: |
        $env:NONINTERACTIVE="true"
        .\crystal_windows_installer.ps1
      shell: powershell

    # Zapisanie skompilowanych plików jako gotowy pakiet
    - name: Upload Compiled Server
      uses: actions/upload-artifact@v4
      with:
        name: crystal-server-windows
        path: |
          **/*.exe
          **/*.dll
